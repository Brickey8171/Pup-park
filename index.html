<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pup Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#22301d;--chip:rgba(255,255,255,.94);--soft:#eef2ea;--accent:#ff7a59;--shadow:0 3px 0 rgba(0,0,0,.14),0 6px 16px rgba(0,0,0,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#4c9c3d;font-family:Fredoka,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
canvas{display:block;touch-action:none;outline:none}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.i .f{fill:currentColor;stroke:none}
/* floating fx */
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.fx{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform,opacity;font-weight:600}
.fx svg{display:block}
.fx.heart{color:#ff4f7a;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.fx.zz{font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);font-weight:700}
.fx.note{color:#fff;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.fx.q{font-size:26px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3);font-weight:700}
/* speech bubbles */
.bub{--bg:#fff;--fg:#22301d;position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.bub .in{position:relative;background:var(--bg);color:var(--fg);padding:7px 14px;border-radius:18px;font:600 17px/1.2 Fredoka,system-ui,sans-serif;max-width:220px;white-space:normal;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.12);animation:pop .35s cubic-bezier(.3,1.6,.5,1) both;transform-origin:50% 120%}
.bub .in::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--bg);border-bottom:0}
.bub.think .in{border-radius:26px;padding:9px 16px}
.bub.think .in::after{border:0;width:12px;height:12px;border-radius:50%;background:var(--bg);bottom:-14px;margin-left:-14px}
.bub.think .in::before{content:"";position:absolute;left:50%;bottom:-24px;margin-left:-20px;width:7px;height:7px;border-radius:50%;background:var(--bg)}
.bub.shout .in{border-radius:6px;font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;padding:9px 16px;transform:rotate(-3deg);box-shadow:0 0 0 3px var(--fg),0 6px 0 3px rgba(0,0,0,.18)}
.bub.shout .in::after{border-top-color:var(--fg);bottom:-12px}
.bub.whisper .in{background:transparent;box-shadow:none;border:2px dashed var(--bg);color:#fff;font-weight:500;font-style:italic;font-size:15px;text-shadow:0 1px 2px rgba(0,0,0,.4);backdrop-filter:blur(2px)}
.bub.whisper .in::after{border-top-color:transparent}
.bub.out .in{animation:bye .25s ease-in both}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bye{to{transform:scale(.4);opacity:0}}
.bub.shout .in{animation-name:popS}
@keyframes popS{from{transform:rotate(-3deg) scale(.2);opacity:0}to{transform:rotate(-3deg) scale(1);opacity:1}}
/* chrome */
#top{z-index:2;position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 16px 0;display:flex;align-items:center;gap:10px;pointer-events:none}
#brand{flex:none;font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding:2px 2px 6px;min-width:0;align-items:center}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:8px 13px;font:500 15px/1 Fredoka,system-ui,sans-serif;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:7px;transition:transform .12s,background .2s,color .2s}
.chip:active{transform:translateY(2px) scale(.97)}
.chip.on{background:var(--ink);color:#fff}
.chip.go{background:var(--accent);color:#fff}
.chip .dot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.chip.off{opacity:.55}
.chip:disabled{opacity:.4;pointer-events:none}
#bottom{z-index:2;position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;pointer-events:none;max-width:640px;margin:0 auto}
#who{display:flex;align-items:center;gap:6px;pointer-events:auto;align-self:flex-start;background:var(--chip);border-radius:999px;padding:5px 6px 5px 12px;box-shadow:var(--shadow);font-weight:600;font-size:15px}
#who .dot{width:12px;height:12px;border-radius:50%}
.mini{border:0;background:var(--soft);border-radius:999px;height:28px;min-width:28px;padding:0 9px;font:600 13px Fredoka,system-ui,sans-serif;cursor:pointer;color:var(--ink);display:none;align-items:center;gap:5px}
.mini svg.i{width:15px;height:15px}
.mini.on{background:var(--ink);color:#fff}
#who.sel .mini{display:flex}
#panel{max-height:42vh;overflow-y:auto;overscroll-behavior:contain;pointer-events:auto;background:rgba(255,255,255,.80);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;padding:10px 10px 4px;box-shadow:0 8px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:2px}
#panel>*{flex-shrink:0}
#panel .row .chip{box-shadow:0 2px 0 rgba(0,0,0,.10)}
.note{font-size:13px;color:#4a5a44;padding:0 4px 6px;line-height:1.3}
.sub{font:600 11px Fredoka;letter-spacing:.08em;text-transform:uppercase;color:#6a7a64;padding:2px 4px 2px}
#tabs{justify-content:space-between;background:var(--chip);border-radius:18px;padding:4px;box-shadow:var(--shadow);gap:2px}
#tabs button{flex:1;border:0;background:transparent;border-radius:14px;padding:7px 4px;font:500 12px Fredoka,system-ui,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:52px}
#tabs button.on{background:var(--ink);color:#fff}
.say{display:flex;gap:8px;padding:0 2px 6px}
.say input{flex:1;min-width:0;border:2px solid #dfe6da;background:#fff;border-radius:999px;padding:9px 14px;font:500 16px Fredoka,system-ui,sans-serif;color:var(--ink);outline:none}
.say input:focus{border-color:var(--ink)}
.plabel{position:absolute;left:0;top:0;min-width:22px;height:22px;padding:0 5px;border-radius:11px;color:#fff;font:700 12px/22px Fredoka,system-ui,sans-serif;text-align:center;display:none;align-items:center;justify-content:center;gap:2px;box-shadow:0 2px 0 rgba(0,0,0,.2);pointer-events:none;border:2px solid #fff}
.plabel svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.plabel.mk{border-radius:6px;transform-origin:center}
.tag.mk{border-radius:7px;background:var(--accent)}
.tag svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.xb{flex:none;border:0;background:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.1);align-self:flex-end}
.xb svg{width:14px;height:14px}
.vols{display:flex;gap:14px;padding:2px 4px 8px}
.vols label{flex:1;display:flex;flex-direction:column;gap:4px;font:600 11px Fredoka,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#6a7a64}
.vols input{width:100%;accent-color:#22301d}
.stop{display:flex;gap:6px;align-items:center;padding:0 2px 6px;flex-wrap:wrap}
.tag{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.stop label{display:flex;flex-direction:column;gap:2px;font:600 10px Fredoka,system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#6a7a64;flex:1;min-width:92px}
.stop select{appearance:none;-webkit-appearance:none;border:0;background:#fff;border-radius:12px;padding:7px 10px;font:500 14px Fredoka,system-ui,sans-serif;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.1);width:100%}
.qi{background:#fff3ec !important}
.qi .n{display:inline-flex;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;align-items:center;justify-content:center}
.sw{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dfe6da;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
#hint{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(34,48,29,.88);color:#fff;padding:8px 14px;border-radius:12px;font-size:14px;pointer-events:none;transition:opacity .5s;max-width:calc(100% - 32px);text-align:center;opacity:0}
#hint.show{opacity:1}
#fade{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff;font-size:18px}
body.rec #top,body.rec #bottom{display:none}
#guide{position:fixed;pointer-events:none;border-radius:4px;box-shadow:0 0 0 9999px rgba(10,20,10,.42);display:none;z-index:1}
#guide.on{display:block}
#guide .g{position:absolute;inset:0;border:2px dashed rgba(255,255,255,.9);border-radius:4px}
#guide .l{position:absolute;background:rgba(255,255,255,.45)}
#guide .safe{position:absolute;background:rgba(255,90,60,.16);border:1px dashed rgba(255,140,110,.8);color:#fff;font:600 10px Fredoka,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#guide .ratio{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.45);color:#fff;font:600 11px Fredoka,system-ui,sans-serif;padding:3px 8px;border-radius:8px}
#guide.recording .g,#guide.recording .l,#guide.recording .safe,#guide.recording .ratio{display:none}
#recbar{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;background:rgba(20,20,20,.75);color:#fff;border-radius:999px;padding:6px 6px 6px 14px;font:600 15px Fredoka,system-ui,sans-serif;z-index:5}
#recbar.on{display:flex}
#recbar .dotr{width:11px;height:11px;border-radius:50%;background:#ff3b3b;animation:blink 1s infinite}
#recbar button{border:0;background:#fff;color:#222;border-radius:999px;padding:7px 12px;font:600 14px Fredoka,system-ui,sans-serif;display:flex;align-items:center;gap:6px;cursor:pointer}
#recbar button span{width:10px;height:10px;background:#ff3b3b;border-radius:2px}
@keyframes blink{50%{opacity:.25}}
#result{position:fixed;inset:0;background:rgba(10,15,10,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#result.on{display:flex}
#result .card{background:#fff;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;max-height:100%;width:min(360px,100%)}
#result video{max-height:calc(100vh - 190px);max-width:100%;aspect-ratio:9/16;border-radius:14px;background:#000}
#result .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#result .note{text-align:center}
#count{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:700 120px Fredoka;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.2);pointer-events:none;opacity:0}
</style>
</head>
<body>
<div id="fx"></div>
<div id="top"><div id="brand">Pup Park</div><button class="chip" id="muteBtn" aria-label="Sound on or off" style="pointer-events:auto;padding:8px 10px"></button><div class="row" id="envs"></div></div>
<div id="hint"></div>
<div id="guide"><div class="g"></div><div class="ratio">9:16 TikTok</div></div>
<div id="count"></div>
<div id="recbar"><span class="dotr"></span><span id="rectime">0:00</span><button id="recstop"><span></span>Stop</button></div>
<div id="result"><div class="card"><video id="resvid" playsinline loop muted autoplay></video><div class="note" id="resnote"></div><div class="acts"><a class="chip go" id="resdl" download>Download</a><button class="chip" id="resshare">Share</button><button class="chip" id="resclose">Close</button></div></div></div>
<div id="bottom">
  <div id="who"><span class="dot" id="whoDot" style="display:none"></span><span id="whoName">Everyone</span><button class="mini" id="lockBtn"></button><button class="mini" id="clear" aria-label="Deselect"></button></div>
  <div id="panel"></div>
  <div class="row" id="tabs"></div>
</div>
<div id="fade"></div>
<div id="err">This page needs an internet connection the first time (it loads three.js from a CDN) and a browser with WebGL.</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
window.__ok = true;

/* ---------- utils ---------- */
const TAU = Math.PI*2;
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[(Math.random()*a.length)|0];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const damp = (a,b,k,dt) => a + (b-a)*(1-Math.exp(-k*dt));
const wrapA = a => { a = (a+Math.PI) % TAU; if (a<0) a += TAU; return a-Math.PI; };
const angDamp = (a,b,k,dt) => a + wrapA(b-a)*(1-Math.exp(-k*dt));
const smooth = (e0,e1,x) => { const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const Z = new THREE.Vector3(0,0,1);

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.1, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0.4);
controls.enablePan = true; controls.screenSpacePanning = false; controls.enableDamping = true; controls.dampingFactor = .08;
controls.minPolarAngle = .2; controls.maxPolarAngle = 1.47;
controls.minDistance = 5; controls.maxDistance = 36;
const CAM_DIR = new THREE.Vector3(0, Math.sin(0.98), Math.cos(0.98));
const fitDist = () => clamp(14.5*Math.pow(Math.max(1, 1.0/(innerWidth/innerHeight)), .5), 13, 24);
camera.position.copy(controls.target).addScaledVector(CAM_DIR, fitDist());

const hemi = new THREE.HemisphereLight(0xffffff, 0x777777, 2);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(4, 14, -3);
sun.castShadow = true;
sun.shadow.mapSize.set(1536, 1536);
Object.assign(sun.shadow.camera, { left:-15, right:15, top:15, bottom:-15, near:1, far:40 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ---------- material / mesh helpers ---------- */
const matCache = new Map();
const lam = c => { const k='l'+c; if(!matCache.has(k)) matCache.set(k, new THREE.MeshLambertMaterial({ color:c })); return matCache.get(k); };
const basic = c => { const k='b'+c; if(!matCache.has(k)) matCache.set(k, new THREE.MeshBasicMaterial({ color:c })); return matCache.get(k); };
const keep = g => (g.userData.keep = true, g);
const SPH = keep(new THREE.SphereGeometry(1, 28, 20));
const SPH_LO = keep(new THREE.SphereGeometry(1, 10, 8));
const CIRC = keep(new THREE.CircleGeometry(1, 24));
function mk(geo, mat, cast=true, recv=true){ const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; return m; }
function sph(r, c, sx=1, sy=1, sz=1){ const m = mk(SPH, lam(c)); m.scale.set(r*sx, r*sy, r*sz); return m; }
function rbox(w,h,d,c,r=.06){ return mk(new RoundedBoxGeometry(w,h,d,3,Math.min(r, w/2-.002, h/2-.002, d/2-.002)), lam(c)); }
function cyl(rt,rb,h,c,seg=20){ return mk(new THREE.CylinderGeometry(rt,rb,h,seg), lam(c)); }
function cone(r,h,c,seg=20){ return mk(new THREE.ConeGeometry(r,h,seg), lam(c)); }
function put(parent, o, x=0, y=0, z=0, ry=0){ o.position.set(x,y,z); if(ry) o.rotation.y = ry; parent.add(o); return o; }
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
const hex = n => '#'+n.toString(16).padStart(6,'0');

/* ---------- ground texture ---------- */
function groundTexture(base, shapes){
  return canvasTex(512, 512, (g, W) => {
    g.fillStyle = base; g.fillRect(0,0,W,W);
    for (let i=0;i<26;i++){
      const col = pick(shapes), x = rand(0,W), y = rand(0,W), s = rand(12,30), type = Math.random(), r0 = rand(-.25,.25), flip = Math.random()<.5;
      for (const dx of [-W,0,W]) for (const dy of [-W,0,W]) {
        g.save(); g.translate(x+dx, y+dy); g.fillStyle = col; g.beginPath();
        if (type < .45){ g.moveTo(0,-s*.55); g.lineTo(s,0); g.lineTo(0,s*.55); g.lineTo(-s,0); }
        else if (type < .8){ g.rotate(flip?Math.PI:0); g.moveTo(-s*.8,-s*.35); g.lineTo(s*.8,-s*.35); g.lineTo(0,s*.45); }
        else { g.rotate(r0); g.rect(-s,-s*.6,s*2,s*1.2); }
        g.closePath(); g.fill(); g.restore();
      }
    }
  });
}
const blobTex = canvasTex(128,128,(g,W)=>{ const gr=g.createRadialGradient(W/2,W/2,0,W/2,W/2,W/2); gr.addColorStop(0,'rgba(0,0,0,.55)'); gr.addColorStop(.55,'rgba(0,0,0,.25)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,W,W); });
const glowTex = canvasTex(64,64,(g,W)=>{ const gr=g.createRadialGradient(W/2,W/2,0,W/2,W/2,W/2); gr.addColorStop(0,'rgba(255,255,220,1)'); gr.addColorStop(.3,'rgba(220,255,140,.8)'); gr.addColorStop(1,'rgba(200,255,100,0)'); g.fillStyle=gr; g.fillRect(0,0,W,W); });

/* ---------- props ---------- */
function picnicTable(g, x, z, ry){
  const t = new THREE.Group(), C1 = 0xf4a56d, C2 = 0xeea064, C3 = 0xe48f57;
  for (let i=0;i<4;i++) put(t, rbox(2.7,.13,.37,i%2?C1:C2,.05), 0, 1.05, -.57+i*.38);
  for (const s of [-1,1]) for (let i=0;i<2;i++) put(t, rbox(2.7,.11,.27,i?C1:C2,.05), 0, .6, s*(.95+i*.29));
  for (const lx of [-.95,.95]){
    for (const s of [-1,1]){ const l = rbox(.16,1.5,.16,C3,.05); l.position.set(lx,.5,s*.55); l.rotation.x = -s*.62; t.add(l); }
    put(t, rbox(.14,.12,2.6,C3,.04), lx, .5, 0);
  }
  put(g, t, x, 0, z, ry); return t;
}
function bush(g, x, z, s=1, c=0x3e9a35, c2=0x4fae3f){
  const b = new THREE.Group();
  [[0,.45,0,.6],[.45,.35,.15,.45],[-.45,.33,.1,.42],[.1,.32,-.38,.42],[-.1,.7,-.05,.38]].forEach(([px,py,pz,r],i)=>put(b, sph(r, i%2?c2:c, 1,.9,1), px,py,pz));
  b.scale.setScalar(s); put(g, b, x, 0, z); return b;
}
function tree(g, x, z, s=1, cols=[0x3c9433,0x4aa83c], trunk=0x8a5a3b){
  const t = new THREE.Group();
  put(t, cyl(.16,.22,1.4,trunk,10), 0,.7,0);
  [[0,1.9,0,1],[.6,1.6,.2,.7],[-.55,1.65,.1,.72],[.1,2.5,-.1,.7],[0,1.6,-.55,.7]].forEach(([px,py,pz,r],i)=>put(t, sph(r, cols[i%cols.length], 1,.92,1), px,py,pz));
  t.scale.setScalar(s); put(g, t, x, 0, z, rand(0,TAU)); return t;
}
function pine(g, x, z, s=1, col=0x2f7f4a, snow=false){
  const t = new THREE.Group();
  put(t, cyl(.12,.16,.6,0x7a4b30,8), 0,.3,0);

function makeFall(group, kind){
  const N = kind==='snow' ? 260 : 80;
  const geo = kind==='snow' ? new THREE.SphereGeometry(.045,6,4) : kind==='leaves' ? new THREE.PlaneGeometry(.22,.14) : new THREE.CircleGeometry(.075,5);
  const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color:0xffffff, side:THREE.DoubleSide }), N);
  const cols = kind==='leaves' ? [0xf08a24,0xd9532b,0xf2b632,0xc0392b] : kind==='petals' ? [0xffc1d6,0xffa8c5,0xffffff] : [0xffffff];
  const P = [], d = new THREE.Object3D(), col = new THREE.Color();
  for (let i=0;i<N;i++){ P.push({x:rand(-12,12), y:rand(0,10), z:rand(-12,12), v:kind==='snow'?rand(.5,1):rand(.5,.9), ph:rand(0,TAU), rx:rand(0,TAU), ry:rand(0,TAU), rest:0}); im.setColorAt(i, col.setHex(pick(cols))); }
  im.castShadow = false; group.add(im);
  return (dt,t) => {
    for (let i=0;i<N;i++){ const p = P[i];
      if (p.rest>0){ p.rest -= dt; if (p.rest<=0){ p.y = rand(8,10); p.x = rand(-12,12); p.z = rand(-12,12);} }
      else {
        p.y -= p.v*dt; p.x += Math.sin(t*.9+p.ph)*.5*dt; p.z += Math.cos(t*.7+p.ph)*.3*dt; p.rx += dt*2; p.ry += dt*1.3;
        if (p.y < .03){ p.y = .03; if (kind==='snow'){ p.y = rand(8,10); p.x=rand(-12,12); p.z=rand(-12,12);} else { p.rest = rand(2,5); p.rx = Math.PI/2; } }
      }
      d.position.set(p.x,p.y,p.z); d.rotation.set(p.rest>0?Math.PI/2:p.rx, p.ry, 0); d.updateMatrix(); im.setMatrixAt(i, d.matrix);
    }
    im.instanceMatrix.needsUpdate = true;
  };
}
function makeButterflies(group, n, cols){
  const bs = [];
  for (let i=0;i<n;i++){
    const b = new THREE.Group(), wings = [];
    const mat = new THREE.MeshLambertMaterial({ color:cols[i%cols.length], side:THREE.DoubleSide });
    for (const s of [-1,1]){ const piv = new THREE.Group(); const w = new THREE.Mesh(CIRC, mat); w.scale.set(.13,.1,1); w.position.x = s*.12; w.rotation.x = -Math.PI/2; piv.add(w); b.add(piv); wings.push([piv,s]); }
    b.add(sph(.025,0x333333,1,1,4));
    group.add(b); bs.push({b, wings, ph:rand(0,TAU), cx:rand(-5,5), cz:rand(-5,5), r:rand(1.5,4), sp:rand(.25,.5)});
  }
  return (dt,t) => bs.forEach(o=>{
    const a = t*o.sp+o.ph, x = o.cx+Math.cos(a)*o.r, z = o.cz+Math.sin(a*1.3)*o.r*.7;
    const dx = -Math.sin(a)*o.r, dz = Math.cos(a*1.3)*o.r*.7*1.3;
    o.b.position.set(x, 1.4+Math.sin(t*2+o.ph)*.4, z); o.b.rotation.y = Math.atan2(dx,dz);
    const f = Math.sin(t*22+o.ph)*1.1; o.wings.forEach(([p,s])=>p.rotation.z = s*f);
  });
}
function makeFireflies(group){
  const N = 45, pos = new Float32Array(N*3), seeds = [];

}

  const cm = new THREE.MeshLambertMaterial({ color:S.cloud, emissive:S.cloud, emissiveIntensity:.55, fog:false, transparent:!!S.stars, opacity:S.stars ? .5 : 1 });
  for (let i=0;i<S.clouds;i++){
    const c = new THREE.Group(), n = 4 + Math.floor(Math.random()*4), w = rand(4,8);
    for (let k=0;k<n;k++){ const m = new THREE.Mesh(SPH_LO, cm); const r = rand(1.6,3); m.scale.set(r*1.3, r*.8, r); m.position.set((k/(n-1)-.5)*w*1.6, rand(-.3,.9)*(k%2?1:.6), rand(-1.2,1.2)); c.add(m); }
    const a = rand(0,TAU), dist = rand(55,120); c.position.set(Math.cos(a)*dist, rand(22,40), Math.sin(a)*dist); c.rotation.y = -a; c.scale.setScalar(rand(.8,1.5)); clouds.add(c);
  }
  up.push(dt => { clouds.rotation.y += dt*.006; });

  const hm = S.hills.map(h => new THREE.MeshLambertMaterial({ color:h }));
  for (let i=0;i<26;i++){
    const a = i/26*TAU + rand(-.08,.08), dist = rand(48,75);
    if (S.sea && Math.sin(a) < .15) continue;   // keep the sea side open on the beach
    const h = mk(SPH_LO, pick(hm), false, false); const r = rand(9,17); h.scale.set(r*1.4, r*rand(.22,.4), r); h.position.set(Math.cos(a)*dist, -r*.05, Math.sin(a)*dist); g.add(h);
  }

const VIEWS = { top:{ polar:.32, f:1.05, ty:0 }, classic:{ polar:Math.PI/2 - .98, f:1, ty:0 }, low:{ polar:1.18, f:.72, ty:.5 }, sky:{ polar:1.44, f:.45, ty:1.2 } };
let viewAnim = null;
function setView(name){
  const V = VIEWS[name] || VIEWS.classic, off = camera.position.clone().sub(controls.target), from = new THREE.Spherical().setFromVector3(off);
  const to = new THREE.Spherical(fitDist()*V.f, V.polar, name==='classic' || name==='top' ? 0 : from.theta);
  viewAnim = { t:0, from, to, fty:controls.target.y, tty:V.ty, ftx:controls.target.x, ftz:controls.target.z, ttz: name==='classic' ? .4 : controls.target.z, ttx: name==='classic' ? 0 : controls.target.x };
}
function updateView(dt){
  if (!viewAnim) return;
  const A = viewAnim; A.t = Math.min(1, A.t + dt/.8); const k = smooth(0, 1, A.t);
  let dth = wrapA(A.to.theta - A.from.theta);
  const sp = new THREE.Spherical(A.from.radius + (A.to.radius-A.from.radius)*k, A.from.phi + (A.to.phi-A.from.phi)*k, A.from.theta + dth*k);
  controls.target.set(A.ftx + (A.ttx-A.ftx)*k, A.fty + (A.tty-A.fty)*k, A.ftz + (A.ttz-A.ftz)*k);
  camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(sp));
  if (A.t >= 1){ viewAnim = null; fitBounds(); }
}

let env = null, envGroup = null, ground = null;
function buildEnv(def){
  if (envGroup){ scene.remove(envGroup); envGroup.traverse(o=>{ if (o.geometry && !o.geometry.userData.keep) o.geometry.dispose(); }); }
  envGroup = new THREE.Group(); scene.add(envGroup);
  const tex = groundTexture(def.ground, def.shapes); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(55,55);
  ground = mk(new THREE.PlaneGeometry(400,400), new THREE.MeshLambertMaterial({ map:tex }), false, true);
  ground.rotation.x = -Math.PI/2; ground.name = 'ground'; envGroup.add(ground);
  const colliders = [], up = [];
  def.build(envGroup, colliders, up);
  if (def.weather==='snow' || def.weather==='leaves' || def.weather==='petals') up.push(makeFall(envGroup, def.weather));
  if (def.weather==='fireflies') up.push(makeFireflies(envGroup));
  const SK = SKIES[def.id];
  scene.background = new THREE.Color(SK.horizon);
  scene.fog = new THREE.Fog(SK.horizon, 32, 150);
  buildSky(def.id, envGroup, up);
  hemi.color.setHex(def.hemi[0]); hemi.groundColor.setHex(def.hemi[1]); hemi.intensity = def.hemi[2];
  sun.color.setHex(def.sun[0]); sun.intensity = def.sun[1];
  document.body.style.background = hex(def.bg);
  const b = Object.assign({minX:-6, maxX:6, minZ:-5.6, maxZ:6.2}, def.bounds||{});
  env = { def, colliders, up, bounds:b, base:b };
  fitBounds();
  holes.forEach(h=>scene.remove(h.m)); holes.length = 0;
}

function fitBounds(){
  if (!env) return;
  camera.updateMatrixWorld();
  const pl = new THREE.Plane(new THREE.Vector3(0,1,0), 0), r = new THREE.Raycaster(), pts = [];
  const fr = (typeof D !== 'undefined' && (D.guides || REC.active)) ? getFrame() : { x:0, y:0, w:innerWidth, h:innerHeight };
  const nx = f => ((fr.x + fr.w*f)/innerWidth)*2-1, ny = f => -(((fr.y + fr.h*f)/innerHeight)*2-1);
  const X0 = nx(.09), X1 = nx(.91), YB = ny(.75), YT = ny(.19);
  for (const [x,y] of [[X0,YB],[X1,YB],[X0,YT],[X1,YT]]){ r.setFromCamera(new THREE.Vector2(x,y), camera); const v = new THREE.Vector3(); if (r.ray.intersectPlane(pl, v)) pts.push(v); }
  const B = env.base, b = { ...B };
  if (pts.length===4){
    b.minX = Math.max(B.minX, Math.max(pts[0].x, pts[2].x) + .6); b.maxX = Math.min(B.maxX, Math.min(pts[1].x, pts[3].x) - .6);
    b.maxZ = Math.min(B.maxZ, Math.min(pts[0].z, pts[1].z) - .4); b.minZ = Math.max(B.minZ, Math.max(pts[2].z, pts[3].z) + .4);
    if (b.maxX - b.minX < 3){ b.minX = -1.5; b.maxX = 1.5; } if (b.maxZ - b.minZ < 3){ b.minZ = -1.5; b.maxZ = 1.5; }
  }
  env.bounds = b;
}

BUILD.face.glasses = (p,c,a,pat,sl) => lensPair(p, sl, (g,e) => { g.add(m3(G_TOR, wMat(c), e.er*1.4, e.er*1.4, e.er*1.4)); g.add(m3(CIRC, wMat(a, { op:.18 }), e.er*1.35, e.er*1.35, 1, 0, 0, .002)); });
BUILD.face.sunglasses = (p,c,a,pat,sl) => lensPair(p, sl, (g,e) => { g.add(m3(CIRC, wMat(c, { op:.92 }), e.er*1.5, e.er*1.3, 1, 0, 0, .004)); g.add(m3(G_TOR, wMat(a), e.er*1.5, e.er*1.3, e.er*1.2)); g.add(m3(CIRC, wMat(0xffffff, { op:.5 }), e.er*.3, e.er*.18, 1, e.er*.5, e.er*.5, .008)); });
BUILD.face.hearts = (p,c,a,pat,sl) => lensPair(p, sl, (g,e) => { const h = mk(heartGeo(), wMat(c, { op:.9 })); h.scale.set(e.er*1.6, e.er*1.6, e.er*.6); h.position.z = -.01; g.add(h); });
BUILD.face.stars = (p,c,a,pat,sl) => lensPair(p, sl, (g,e) => { const h = mk(shapeGeo('star5', starPts()), wMat(c, { op:.92, em:.2 })); h.scale.set(e.er*1.9, e.er*1.9, e.er*.6); g.add(h); });
BUILD.face.goggles = (p,c,a,pat,sl) => { const H = p.H; lensPair(p, sl, (g,e) => { g.add(m3(CIRC, wMat(c, { op:.75 }), e.er*1.75, e.er*1.55, 1, 0, 0, .006)); g.add(m3(G_TORT, wMat(a), e.er*1.75, e.er*1.55, e.er*1.5)); }, false);
  const band = m3(G_TOR, wMat(a), H*1.02, H*.96, H*.6, 0, p.eyes[0].g.position.y + H*.02, -H*.02); band.rotation.x = Math.PI/2; wearAdd(p, sl, p.head, band); };
BUILD.face.monocle = (p,c,a,pat,sl) => { const e = p.eyes[1], g = eyeFrame(p, e, .05); g.add(m3(G_TOR, wMat(c, { em:.2 }), e.er*1.45, e.er*1.45, e.er*1.5)); g.add(m3(CIRC, wMat(0xffffff, { op:.2 }), e.er*1.4, e.er*1.4, 1)); const ch = m3(G_CYL, wMat(c), p.H*.012, p.H*.6, p.H*.012, e.er*.9, -p.H*.32, -p.H*.02); ch.rotation.z = .3; g.add(ch); wearAdd(p, sl, p.head, g); };

BUILD.face.mustache = (p,c,a,pat,sl) => { for (const s of [-1,1]){ const m = m3(SPH, wMat(c), p.H*.2, p.H*.07, p.H*.07, s*p.H*.17, p.nosePos.y - p.H*.13, p.nosePos.z - p.H*.02); m.rotation.z = s*-.35; m.rotation.y = s*.4; wearAdd(p, sl, p.head, m); } };

BUILD.neck.wreath = (p,c,a,pat,sl) => { const mt = wMat(c), H = p.H; along(p, 16, (v,i) => wearAdd(p, sl, p.neck, m3(SPH, mt, H*.15, H*.13, H*.15, v.x, v.y, v.z))); along(p, 8, (v,i) => wearAdd(p, sl, p.neck, m3(SPH, wMat(a), H*.06, H*.06, H*.06, v.x*1.12, v.y*1.12, v.z*1.12 + H*.02)));

BUILD.neck.scarf = (p,c,a,pat,sl) => { const mt = wMat(c, { pat:pat||'stripes', a }), H = p.H; ringAt(p, sl, mt, 1.06, 1, G_TORT); const f = neckFront(p);

BUILD.neck.bowtie = (p,c,a,pat,sl) => { const f = neckFront(p), H = p.H, g = new THREE.Group(); g.position.set(f.x, f.y - H*.1, f.z + H*.1); g.rotation.x = -.5; const mt = wMat(c, { pat:pat||'solid', a });

BUILD.neck.bandana = (p,c,a,pat,sl) => { const mt = wMat(c, { pat:pat||'dots', a, ds:true }), H = p.H; ringAt(p, sl, mt, 1.02, .9); const f = neckFront(p);

BUILD.neck.tie = (p,c,a,pat,sl) => { const mt = wMat(c, { pat:pat||'stripes', a }), H = p.H, f = neckFront(p); ringAt(p, sl, wMat(0xffffff), 1, .6);

BUILD.neck.lei = (p,c,a,pat,sl) => { const H = p.H; along(p, 16, (v,i) => wearAdd(p, sl, p.neck, m3(SPH, wMat([c, a, 0xffffff][i%3]), H*.12, H*.1, H*.12, v.x*1.05, v.y*1.05 - H*.03, v.z*1.05))); };
BUILD.neck.pearls = (p,c,a,pat,sl) => { const H = p.H; along(p, 22, (v,i) => wearAdd(p, sl, p.neck, m3(SPH, wMat(c, { em:.15 }), H*.065, H*.065, H*.065, v.x*1.04, v.y*1.04 - H*.04, v.z*1.04))); };
BUILD.neck.medal = (p,c,a,pat,sl) => { const f = neckFront(p), H = p.H; for (const s of [-1,1]){ const r = m3(G_BOX, wMat(a), H*.09, H*.45, H*.03, f.x + s*H*.1, f.y - H*.05, f.z + H*.04); r.rotation.set(-.5, 0, s*.4); wearAdd(p, sl, p.neck, r); }
  const m = m3(G_CYL, wMat(c, { em:.25 }), H*.17, H*.05, H*.17, f.x, f.y - H*.3, f.z + H*.16); m.rotation.x = Math.PI/2 - .6; wearAdd(p, sl, p.neck, m); const st = mk(shapeGeo('star5', starPts()), wMat(0xfff1b0)); st.scale.setScalar(H*.1); st.position.set(f.x, f.y - H*.28, f.z + H*.2); st.rotation.x = -.6; wearAdd(p, sl, p.neck, st); };

BUILD.body.sweater = (p,c,a,pat,sl) => { const mt = wMat(c, { pat:pat||'stripes', a, ds:true }); torsoBand(p, sl, mt, .12, .72); sleeves(p, sl, mt, null); };

BUILD.body.hoodie = (p,c,a,pat,sl) => { const mt = wMat(c, { pat:pat||'solid', a, ds:true }), H = p.H; torsoBand(p, sl, mt, .1, .75); sleeves(p, sl, mt, null);

BUILD.body.tshirt = (p,c,a,pat,sl) => { const mt = wMat(c, { pat:pat||'solid', a, ds:true }); torsoBand(p, sl, mt, .12, .55); sleeves(p, sl, mt, wMat(a), .2);

BUILD.body.raincoat = (p,c,a,pat,sl) => { const mt = wMat(c, { ds:true }), H = p.H; torsoBand(p, sl, mt, .06, .86, 0, TAU, 1.1); sleeves(p, sl, mt, null, .5); wearAdd(p, sl, p.neck, m3(SPH, mt, H*.75, H*.45, H*.55, 0, H*.12, -H*.42));

BUILD.body.santa = (p,c,a,pat,sl) => { const mt = wMat(c, { ds:true }), fur = wMat(a); torsoBand(p, sl, mt, .1, .8); sleeves(p, sl, mt, fur, .46); bandRing(p, sl, fur, .1, 1.09, 1.6); bandRing(p, sl, fur, .8, 1.09, 1.6);
  bandRing(p, sl, wMat(0x26262b), .47, 1.09, 1.1); const z = Math.cos(Math.PI*.47)*p.L*1.06; wearAdd(p, sl, p.torso, m3(G_BOX, wMat(0xe8b430, { em:.2 }), p.R*.36, p.R*.1, p.R*.28, 0, p.R*1.04, z)); };
BUILD.body.elfsuit = (p,c,a,pat,sl) => { const mt = wMat(c, { ds:true }); torsoBand(p, sl, mt, .1, .76); sleeves(p, sl, mt, wMat(a), .44); bandRing(p, sl, wMat(0x26262b), .5, 1.09, 1.1);
  const z = Math.cos(Math.PI*.5)*p.L; wearAdd(p, sl, p.torso, m3(G_BOX, wMat(0xe8b430, { em:.2 }), p.R*.3, p.R*.1, p.R*.24, 0, p.R*1.04, z));
  const th = Math.PI*.1, rr = Math.sin(th); for (let i=0;i<10;i++){ const an = i/10*TAU; const s = m3(G_CONE, wMat(a), p.R*.14, p.R*.28, p.R*.06); s.position.set(Math.cos(an)*p.R*1.1*rr*1.6, Math.sin(an)*p.R*1.05*rr*1.6, Math.cos(th)*p.L*1.02); s.rotation.x = Math.PI/2; s.rotation.y = 0; wearAdd(p, sl, p.torso, s); } };

  for (let i=0;i<3;i++) wearAdd(p, sl, p.torso, m3(SPH, wMat(0x26262b), p.R*.06, p.R*.06, p.R*.03, 0, -p.R*1.0, p.L*(.4 - i*.2))); };

const backY = (p, z) => p.R*.95*Math.sqrt(Math.max(0, 1 - (z/p.L)**2));
BUILD.back.backpack = (p,c,a,pat,sl) => { const R = p.R, L = p.L, z = -L*.05; wearAdd(p, sl, p.torso, m3(G_BOX, wMat(c), R*1.05, R*.6, L*.72, 0, backY(p,z) + R*.12, z)); wearAdd(p, sl, p.torso, m3(G_BOX, wMat(a), R*.6, R*.3, L*.3, 0, backY(p,z) + R*.3, z + L*.12)); bandRing(p, sl, wMat(c), .3, 1.09, .6); bandRing(p, sl, wMat(c), .62, 1.09, .6); };
BUILD.back.gift = (p,c,a,pat,sl) => { const R = p.R, z = -p.L*.08, y = backY(p, z) + R*.42, s = R*.85; wearAdd(p, sl, p.torso, m3(G_BOX, wMat(c), s, s, s, 0, y, z)); wearAdd(p, sl, p.torso, m3(G_BOX, wMat(a), s*1.03, s*1.03, s*.2, 0, y, z)); wearAdd(p, sl, p.torso, m3(G_BOX, wMat(a), s*.2, s*1.03, s*1.03, 0, y, z));
  for (const r of [-.6,.6]){ const b = m3(SPH, wMat(a), s*.3, s*.18, s*.12, Math.sin(r)*s*.25, y + s*.6, z); b.rotation.z = r; wearAdd(p, sl, p.torso, b); } };
function wingPair(p, sl, mat, shape, sx, sy, pairs=1){ for (let k=0;k<pairs;k++) for (const s of [-1,1]){ const g = new THREE.Group(); g.position.set(s*p.R*.4, p.R*.78, p.L*(.25 - k*.32)); const w = mk(shape, mat); w.scale.set(s*sx*(k?.75:1), sy*(k?.7:1), 1); w.rotation.x = -Math.PI/2; g.add(w); w.position.x = s*p.R*.05; wearAdd(p, sl, p.torso, g); p.flaps.push({ slot:sl, o:g, s, type:'wing', base:.55 + k*.2 }); } }
BUILD.back.wings = (p,c,a,pat,sl) => { const geo = G_BAND.wingA || (G_BAND.wingA = keep((() => { const s = new THREE.Shape(); s.moveTo(0,0); s.bezierCurveTo(.4,.5,1.1,.75,1.3,.55); s.bezierCurveTo(1.2,.35,1.15,.3,1.05,.25); s.bezierCurveTo(1.1,.1,.9,0,.85,-.05); s.bezierCurveTo(.8,-.2,.55,-.2,.45,-.25); s.bezierCurveTo(.3,-.2,.1,-.1,0,0); return new THREE.ExtrudeGeometry(s, { depth:.06, bevelEnabled:true, bevelThickness:.03, bevelSize:.03, bevelSegments:2 }); })()));
  wingPair(p, sl, wMat(c, { ds:true }), geo, p.R*1.1, p.R*1.1); };
BUILD.back.fairy = (p,c,a,pat,sl) => { const geo = G_BAND.wingF || (G_BAND.wingF = keep((() => { const s = new THREE.Shape(); s.moveTo(0,0); s.bezierCurveTo(.2,.9,1.2,1.0,1.0,.3); s.bezierCurveTo(.9,0,.4,-.1,0,0); return new THREE.ShapeGeometry(s, 16); })()));
  wingPair(p, sl, wMat(c, { ds:true, op:.62 }), geo, p.R*1.25, p.R*1.2, 2); };

BUILD.back.dino = (p,c,a,pat,sl) => { const n = 6; for (let i=0;i<n;i++){ const z = p.L*(.7 - i*1.5/(n-1)), y = backY(p, z), h = p.R*(.5 - Math.abs(i-1.5)*.06); const sp = m3(G_CONE, wMat(i%2 ? a : c), p.R*.2, h, p.R*.1, 0, y + h*.4, z); wearAdd(p, sl, p.torso, sp); } };
BUILD.back.fin = (p,c,a,pat,sl) => { const f = mk(shapeGeo('fin', [[-.5,0],[.5,0],[.15,.25],[-.25,.95],[-.35,.6]], .1), wMat(c)); f.scale.setScalar(p.R*1.1); f.rotation.y = Math.PI/2; f.position.set(-p.R*.06, backY(p, -p.L*.1) - p.R*.05, -p.L*.1); wearAdd(p, sl, p.torso, f); };
BUILD.back.saddlebags = (p,c,a,pat,sl) => { const R = p.R, L = p.L; for (const s of [-1,1]){ wearAdd(p, sl, p.torso, m3(G_BOX, wMat(c), R*.35, R*.7, L*.6, s*R*1.05, -R*.05, -L*.1)); wearAdd(p, sl, p.torso, m3(G_BOX, wMat(a), R*.38, R*.2, L*.25, s*R*1.06, R*.15, -L*.1)); } torsoBand(p, sl, wMat(c, { ds:true }), .5, .6, Math.PI, Math.PI, 1.08); };
/* ---- feet (built on each leg) ---- */
function eachLeg(p, sl, fn){ for (const k of ['fl','fr','bl','br']){ const g = new THREE.Group(); fn(g, p.legLen, p.lr); wearAdd(p, sl, p.legs[k], g); } }
const pawY = (L, lr) => -L + lr*.95;
BUILD.feet.booties = (p,c,a,pat,sl) => eachLeg(p, sl, (g, L, lr) => { g.add(m3(SPH, wMat(c), lr*1.5, lr*1.2, lr*1.75, 0, pawY(L,lr), lr*.3)); const cf = m3(G_TOR, wMat(a), lr*1.3, lr*1.3, lr*2.6, 0, pawY(L,lr) + lr*1.1, 0); cf.rotation.x = Math.PI/2; g.add(cf); });

/* outfits: defaults, saving, presets */
const OUTFIT_KEY = 'pupPark.outfits.v1';
function loadOutfits(){ try { return JSON.parse(localStorage.getItem(OUTFIT_KEY) || '{}'); } catch(e){ return {}; } }
function saveOutfits(){ try { const o = {}; pets.forEach(p => o[p.d.id] = p.outfit); const all = Object.assign(loadOutfits(), o); localStorage.setItem(OUTFIT_KEY, JSON.stringify(all)); } catch(e){} }
function itemDefaults(slot, id){ const it = WITEM[slot+':'+id]; return { id, c:it?.[2] ?? 0xffffff, a:it?.[3] ?? 0xffffff, pat:(it?.[4]||'').includes('p') ? ({ xsweater:'xmas', sweater:'stripes', scarf:'stripes', socks:'stripes', party:'stripes', tie:'stripes', bandana:'dots', dress:'dots', denim:'denim', jeans:'denim', overalls:'denim', flannel:'plaid', skirt:'plaid' }[id] || 'solid') : null }; }
function defaultOutfit(d){ const o = {}; for (const [sl] of SLOTS) o[sl] = { id:'none' }; for (const sl in (d.outfit||{})) o[sl] = Object.assign(itemDefaults(sl, d.outfit[sl].id), d.outfit[sl]); return o; }
function setItem(p, slot, id, keepColours=false){ const prev = p.outfit[slot]; p.outfit[slot] = id==='none' ? { id:'none' } : Object.assign(itemDefaults(slot, id), keepColours && prev && prev.id!=='none' ? { c:prev.c, a:prev.a } : {}); dressPet(p, slot); saveOutfits(); }
function applyPreset(p, name){
  const list = PRESETS[name]; if (!list) return;
  for (const [sl] of SLOTS){ p.outfit[sl] = { id:'none' }; }
  const pr = name==='random' ? null : list[pets.indexOf(p) % list.length];
  for (const sl in pr) if (pr[sl] !== 'none') p.outfit[sl] = itemDefaults(sl, pr[sl]);
  if (name==='winter' || name==='summer' || name==='party') for (const sl in pr){ const o = p.outfit[sl]; if (o.id!=='none' && Math.random()<.6) o.c = pick(PALETTE); }
  dressAll(p); saveOutfits();
}
function randomOutfit(p){
  for (const [sl] of SLOTS){ const items = WARDROBE[sl], chance = { head:.8, face:.4, neck:.6, body:.65, legs:.35, back:.35, feet:.4 }[sl];
    if (Math.random() > chance){ p.outfit[sl] = { id:'none' }; continue; }
    const it = pick(items.slice(1)); p.outfit[sl] = itemDefaults(sl, it[0]); if (Math.random()<.5){ p.outfit[sl].c = pick(PALETTE); p.outfit[sl].a = pick(PALETTE.filter(x => x !== p.outfit[sl].c)); }
    if (p.outfit[sl].pat && Math.random()<.5) p.outfit[sl].pat = pick(PATTERNS)[0]; }
  dressAll(p); saveOutfits();
}
const wearing = (p, slot, id) => p.outfit && p.outfit[slot] && p.outfit[slot].id === id;

const MOODS = ['bark','howl','nod','no','tilt','look','love','sad','surprise','sneeze'];

/* ---------- particles, holes, treats ---------- */
const parts = [];
function burst(pos, color, n, size=.05, speed=2.5, back=0){
  for (let i=0;i<n;i++){
    const m = mk(SPH_LO, lam(color), false, false); m.scale.setScalar(size*rand(.7,1.3)); m.position.copy(pos);
    scene.add(m);
    parts.push({ m, v:new THREE.Vector3(rand(-1,1)*speed*.5, rand(.6,1)*speed, rand(-1,1)*speed*.5), life:rand(.6,1.1), s:m.scale.x });
  }
}
const holes = [];
function makeHole(x,z){
  const m = new THREE.Mesh(CIRC, new THREE.MeshLambertMaterial({ color:env.def.hole, transparent:true, opacity:0, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.set(x,.012,z); m.scale.set(.32,.24,1); scene.add(m);
  holes.push({ m, t:0 });
}
let treat = null;
function dropTreat(x, z){
  const b = env.bounds; x = clamp(x, b.minX, b.maxX); z = clamp(z, b.minZ, b.maxZ);
  if (treat) scene.remove(treat.m);
  const g = new THREE.Group(), C = 0xf6e7c6;
  const bar = cyl(.05,.05,.36,C,10); bar.rotation.z = Math.PI/2; g.add(bar);
  for (const sx of [-.18,.18]) for (const sz of [-.05,.05]) put(g, sph(.07,C), sx,0,sz);
  g.position.set(x, 3, z); scene.add(g);
  treat = { m:g, x, z, y:3, vy:0, landed:false, t:0 }; sfx('fall');
  pets.forEach(p => {
    if (p.leaving) return;
    if (p.actName==='sleep'){ p.setAct('surprise', { then:'goto' }); }
    else setTimeout(()=>{ if (treat && pets.includes(p) && !p.leaving) p.setAct('goto'); }, rand(0,300));
  });
}
function eatTreat(p){
  if (!treat) return;
  scene.remove(treat.m); treat = null;
  p.setAct('eat', { then:'jump' }); p.happyHearts = true;
  fxFloat(p,'heart','heart');
  pets.forEach(o => { if (o!==p && (o.actName==='goto' || o.queue.includes('goto'))){ o.queue = []; o.setAct('sad'); } });
}

const HOLD = ['sit','lie','beg','sleep','look','sniff','sad','tilt','love','wag','idle','wave','dance','dig','scratch','howl','bow','wiggle','bounce','dead'];

function startOverlay(p, name, fromPath){

function runItem(p, q){
  const name = typeof q === 'string' ? q : q.a;
  if (name){ p.setAct(name, { force:true, keep:true }); if (HOLD.includes(name) && p.dur > 2) p.dur = 2; return true; }
  if (q.resume){ p.locked = false; p.setAct('path', { force:true, keep:true, resume:true }); return true; }
  if (q.face){ p.turnTo = Math.atan2(camera.position.x-p.x, camera.position.z-p.z); const da = Math.abs(wrapA(p.turnTo - p.heading)); p.setAct('idle', { keep:true }); p.dur = clamp(Math.log(Math.max(da,.06)/.06)/7, .15, .8); return true; }

}
const itemLabel = q => typeof q === 'string' ? ACTIONS[q].label : q.a ? ACTIONS[q.a].label : q.face ? 'Face camera' : q.wait ? `Wait ${q.wait}s` : q.say ? `"${q.say.length>18?q.say.slice(0,17)+'...':q.say}"` : '?';

document.addEventListener('click', e => {

  if (ds.wslot){ D.wslot = ds.wslot; renderPanel(); return; }
  if (ds.witem && p){ setItem(p, D.wslot || 'head', ds.witem, true); sfx('pop', p); renderPanel(); return; }
  if (ds.wc && p){ const o = p.outfit[D.wslot||'head']; o.c = +ds.wc; dressPet(p, D.wslot||'head'); saveOutfits(); renderPanel(); return; }
  if (ds.wa && p){ const o = p.outfit[D.wslot||'head']; o.a = +ds.wa; dressPet(p, D.wslot||'head'); saveOutfits(); renderPanel(); return; }
  if (ds.wp && p){ const o = p.outfit[D.wslot||'head']; o.pat = ds.wp; dressPet(p, D.wslot||'head'); saveOutfits(); renderPanel(); return; }
  if (ds.wpre){ const list = ds.wall ? pets : (p ? [p] : []); list.forEach(q => { if (ds.wpre==='random') randomOutfit(q); else if (ds.wpre==='undress'){ for (const [k] of SLOTS) q.outfit[k] = { id:'none' }; dressAll(q); saveOutfits(); } else applyPreset(q, ds.wpre); q.setAct('wag', { manual:true }); fxFloat(q,'heart','heart'); }); sfx('swish'); renderPanel(); return; }
  if (ds.wcopy && p){ pets.forEach(q => { if (q === p) return; q.outfit = JSON.parse(JSON.stringify(p.outfit)); dressAll(q); }); saveOutfits(); sfx('swish'); renderPanel(); return; }
  const c = ds.cmd; if (!c) return;
  switch (c){
    case 'lock': if (p){ p.locked = !p.locked; if (p.locked && ['walk','zoomies','goto'].includes(p.actName)) p.setAct('idle'); } renderWho(); break;
    case 'lockAll': pets.forEach(q=>{ q.locked = true; if (['walk','zoomies','goto'].includes(q.actName)) q.setAct('idle'); }); break;
    case 'unlockAll': pets.forEach(q=>q.locked=false); break;
    case 'rotL': if (p){ p.turnTo = (p.turnTo ?? p.heading) + Math.PI/4; } break;
    case 'rotR': if (p){ p.turnTo = (p.turnTo ?? p.heading) - Math.PI/4; } break;
    case 'face': if (p){ p.turnTo = Math.atan2(camera.position.x-p.x, camera.position.z-p.z); } break;
    case 'qmode': D.qmode = !D.qmode; break;
    case 'qadd': if (p){ const v = b.dataset.v; p.path.after.push(v==='face'?{face:1}:v.startsWith('wait')?{wait:+v.slice(4)}:{a:v}); } break;

    case 'qclear': if (p){ p.path.after = []; } break;
    case 'qsay': if (p){ const v = ($('#qSay')||{}).value || ''; if (v.trim()) p.path.after.push({ say:v.trim(), style:D.style, color:D.color, dur:Math.min(D.dur,4), type:D.type }); } break;
    case 'qsayTalk': if (p && D.text.trim()){ p.path.after.push({ say:D.text.trim(), style:D.style, color:D.color, dur:Math.min(D.dur,4), type:D.type }); hint(`Line queued for ${p.d.name}`,1400); } break;
    case 'play': if (p) playPath(p); break;
    case 'playAll': playAll(); break;
    case 'loop': if (p){ p.path.loop = !p.path.loop; pathMarkers(p); } break;
    case 'undo': if (p){ const h = p.path.hist||[], last = h.pop(); const i = last ? p.path.pts.indexOf(last) : -1; if (i>=0) p.path.pts.splice(i,1); else p.path.pts.pop(); pathMarkers(p); } break;
    case 'prm': if (p){ const pts = p.path.pts, i = +b.dataset.i; pts.splice(i,1); if (i===0) while (pts.length && pts[0].marker) pts.shift(); if (pts.length && pts[0]){ delete pts[0].walk; delete pts[0].speed; } p.path.hist = (p.path.hist||[]).filter(q => pts.includes(q)); pathMarkers(p); } break;
    case 'mark': D.mark = b.dataset.v; break;

    case 'treats': D.treats = !D.treats; break;

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null, lastTap = 0;
renderer.domElement.addEventListener('pointerdown', e => { down = { x:e.clientX, y:e.clientY, t:performance.now() }; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down) return; const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y), dt = performance.now()-down.t; down = null;
  if (moved > 8 || dt > 500) return;
  const now = performance.now();
  if (D.rec){ if (now - lastTap < 350){ if (REC.active) stopRecording(); else exitRec(); lastTap = 0; } else lastTap = now; return; }
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  const petMeshes = []; pets.forEach(p => p.root.traverse(o => { if (o.isMesh) petMeshes.push(o); }));
  const hit = ray.intersectObjects(petMeshes, false)[0];

}
function restoreRenderer(){
  if (REC.prevPR == null) return;
  camera.clearViewOffset(); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(REC.prevPR); renderer.setSize(innerWidth, innerHeight);
  Object.assign(renderer.domElement.style, { position:'', left:'', top:'' });
  REC.prevPR = null; fxLayer.style.visibility = '';
  clearRecSprites();
}
/* while recording, bubbles and floating icons are drawn as sprites inside the 3D scene so they end up in the video */
const REC_LAYER = new THREE.Group(); scene.add(REC_LAYER);
const FX_TEX = {};
function fxTexture(kind){
  if (FX_TEX[kind]) return FX_TEX[kind];
  const S = 128, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.shadowColor = 'rgba(0,0,0,.28)'; g.shadowOffsetY = 5; g.shadowBlur = 4;
  if (kind==='heart' || kind==='note'){ g.translate(S*.1, S*.04); g.scale(S*.8/24, S*.8/24); g.fillStyle = kind==='heart' ? '#ff4f7a' : '#ffffff'; g.fill(kind==='heart' ? HEART : NOTE); }
  else { g.font = `700 ${S*.78}px Fredoka, system-ui, sans-serif`; g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(kind, S/2, S/2+4); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return FX_TEX[kind] = t;
}
function makeSprite(map){ const m = new THREE.SpriteMaterial({ map, depthTest:false, depthWrite:false, transparent:true, sizeAttenuation:false }); const sp = new THREE.Sprite(m); sp.center.set(.5, 0); sp.renderOrder = 999; REC_LAYER.add(sp); return sp; }
function pxScale(sp, wCss, hCss){ const f = REC.f, e = camera.projectionMatrix.elements; sp.scale.set(2*wCss/f.w/e[0], 2*hCss/f.h/e[5], 1); }
function bubbleMetrics(ctx, st, text, k){
  const fs = (st==='shout' ? 20 : st==='whisper' ? 15 : 17)*k;
  ctx.font = `${st==='whisper'?'italic ':''}${st==='shout'?700:st==='whisper'?500:600} ${fs}px Fredoka, system-ui, sans-serif`;
  const padX = (st==='speech'||st==='whisper' ? 14 : 16)*k, padY = (st==='speech'||st==='whisper' ? 7 : 9)*k, lh = fs*1.2;
  const lines = wrapLines(ctx, st==='shout' ? text.toUpperCase() : text, 220*k - padX*2);
  const tw = Math.max(...lines.map(l => ctx.measureText(l).width), 6*k);
  return { fs, padX, padY, lh, lines, w:tw+padX*2, h:lines.length*lh+padY*2 };
}
function paintBubble(b, text){
  const { ctx, k, cw, ch, mb } = b.spr.userData, st = b.style, [bg, fg] = b.colors;
  ctx.clearRect(0, 0, cw, ch);
  const M = bubbleMetrics(ctx, st, text, k), cx = cw/2, by = ch - mb - M.h, bx = cx - M.w/2, w = M.w, h = M.h;
  ctx.save();
  if (st==='shout'){ ctx.translate(cx, by+h/2); ctx.rotate(-3*Math.PI/180); ctx.translate(-cx, -(by+h/2)); }
  const r = (st==='think' ? 26 : st==='shout' ? 6 : 18)*k;
  if (st==='whisper'){ ctx.setLineDash([5*k, 4*k]); ctx.lineWidth = 2*k; ctx.strokeStyle = bg; rr(ctx, bx, by, w, h, Math.min(r, h/2)); ctx.stroke(); ctx.setLineDash([]); }
  else {
    ctx.shadowColor = 'rgba(0,0,0,.16)'; ctx.shadowBlur = 14*k; ctx.shadowOffsetY = 5*k;
    if (st==='shout'){ ctx.fillStyle = fg; rr(ctx, bx-3*k, by-3*k, w+6*k, h+6*k, r+2*k); ctx.fill(); ctx.beginPath(); ctx.moveTo(cx-10*k, by+h); ctx.lineTo(cx+10*k, by+h); ctx.lineTo(cx, by+h+13*k); ctx.fill(); ctx.shadowColor = 'transparent'; }
    ctx.fillStyle = bg; rr(ctx, bx, by, w, h, Math.min(r, h/2)); ctx.fill(); ctx.shadowColor = 'transparent';
    if (st==='speech'){ ctx.beginPath(); ctx.moveTo(cx-9*k, by+h-1); ctx.lineTo(cx+9*k, by+h-1); ctx.lineTo(cx, by+h+9*k); ctx.fill(); }
    if (st==='think'){ ctx.beginPath(); ctx.arc(cx-8*k, by+h+8*k, 6*k, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.arc(cx-16.5*k, by+h+20.5*k, 3.5*k, 0, TAU); ctx.fill(); }
  }
  ctx.fillStyle = st==='whisper' ? '#ffffff' : fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (st==='whisper'){ ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 2*k; ctx.shadowOffsetY = k; }
  M.lines.forEach((l,i) => ctx.fillText(l, cx, by + M.padY + M.lh*(i+.5)));
  ctx.restore();
  b.spr.userData.boxW = w; b.spr.material.map.needsUpdate = true; b.drawn = text;
}
function updateRecSprites(){
  const alive = new Set(), f = REC.f, k = REC.H / f.h;
  for (const fx of fxList){
    if (!fx.spr){ const cls = fx.el.className, kind = cls.includes('heart') ? 'heart' : cls.includes('note') ? 'note' : fx.el.textContent; fx.spr = makeSprite(fxTexture(kind)); fx.size = kind==='heart' ? 28 : kind==='note' ? 26 : (kind==='?'||kind==='!') ? 32 : 26; }
    alive.add(fx.spr);
    fx.spr.position.copy(fx.pos).add({ x:fx.dx*fx.t, y:fx.t*.9, z:0 });
    const q = fx.t/fx.life, sc = .6 + Math.min(1, fx.t*4)*.4 + q*.3;
    fx.spr.material.opacity = q > .75 ? (1-q)/.25 : 1; pxScale(fx.spr, fx.size*sc, fx.size*sc);
  }
  const now = performance.now();
  for (const b of bubbles){
    if (!b.spr){
      const tmp = document.createElement('canvas').getContext('2d'), M = bubbleMetrics(tmp, b.style, b.text, k);
      const mx = 30*k, mt = 24*k, mb = 34*k, cw = Math.ceil(M.w + mx*2), ch = Math.ceil(M.h + mt + mb);
      const c = document.createElement('canvas'); c.width = cw; c.height = ch;
      const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = false; t.minFilter = THREE.LinearFilter;
      b.spr = makeSprite(t); b.spr.center.set(.5, mb/ch);
      Object.assign(b.spr.userData, { ctx:c.getContext('2d'), k, cw, ch, mb, own:true });
    }
    alive.add(b.spr);
    const text = b.inn.textContent; if (b.drawn !== text) paintBubble(b, text);
    let s; if (b.dying) s = Math.max(.01, 1 - (now-b.dyingAt)/250); else { const t = Math.min(1, b.t/.35), c1 = 2.2; s = Math.max(.01, 1 + (c1+1)*Math.pow(t-1,3) + c1*Math.pow(t-1,2)); }
    b.spr.material.opacity = b.dying ? s : Math.min(1, b.t/.12);
    headPos(b.p, b.spr.position); b.spr.position.y += .1;
    const ud = b.spr.userData; pxScale(b.spr, ud.cw/k*s, ud.ch/k*s);
    // keep the bubble inside the video frame
    tmpV.copy(b.spr.position).project(camera);
    const half = ud.boxW/k/f.w*s, edge = 1 - 12/f.w*2, full = ud.cw/k/f.w*2*s; let cx = .5;
    if (tmpV.x - half < -edge) cx = .5 - ((-edge) - (tmpV.x - half))/full;
    else if (tmpV.x + half > edge) cx = .5 + ((tmpV.x + half) - edge)/full;
    b.spr.center.x = cx;
  }
  for (const sp of [...REC_LAYER.children]) if (!alive.has(sp)) disposeSprite(sp);
}
function disposeSprite(sp){ REC_LAYER.remove(sp); if (sp.userData.own) sp.material.map.dispose(); sp.material.dispose(); }
function clearRecSprites(){ [...REC_LAYER.children].forEach(disposeSprite); fxList.forEach(f => f.spr = null); bubbles.forEach(b => { b.spr = null; b.drawn = null; }); }
/* automatic render resolution: drops sharpness a little on slow devices to keep it smooth */
const PERF = { ema:1/60, t:0, max:Math.min(devicePixelRatio, 2), hold:0 };
function adaptQuality(rdt){
  if (REC.active || REC.prevPR != null) return;
  PERF.ema = PERF.ema*.94 + rdt*.06; PERF.t += rdt; PERF.hold -= rdt;
  if (PERF.t < 1.5) return; PERF.t = 0;
  const pr = renderer.getPixelRatio();
  if (PERF.ema > 1/42 && pr > 1){ renderer.setPixelRatio(Math.max(1, pr - .25)); renderer.setSize(innerWidth, innerHeight); PERF.hold = 12; }
  else if (PERF.ema < 1/57 && pr < PERF.max && PERF.hold <= 0){ renderer.setPixelRatio(Math.min(PERF.max, pr + .25)); renderer.setSize(innerWidth, innerHeight); }
}

/* ---------- loop ---------- */
addEventListener('resize', () => {
  if (REC.active) return;
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  const dir = camera.position.clone().sub(controls.target).normalize(); camera.position.copy(controls.target).addScaledVector(dir, fitDist()); fitBounds(); layoutGuide();
});

buildEnv(ENVS[0]);
DEFAULT_CAST.forEach(id => addPet(DEFS.find(d=>d.id===id)));
pets.forEach(p => { p.pop = rand(-.8,0); p.setAct(pick(['idle','sit','wag','walk'])); });
buildUI(); layoutGuide(); fitBounds(); renderMute();
setTimeout(()=>hint('Tap a pet to direct it. Tap the grass to toss a treat.', 5000), 600);

const clock = new THREE.Clock(); let T = 0;
function frame(){
  // real-time clock: low frame rates no longer slow the scene down; big steps are split for smooth motion
  const rdt = Math.min(clock.getDelta(), .5), dt = rdt*D.speed;
  env.up.forEach(f => f(dt, T + dt));
  const steps = Math.max(1, Math.ceil(dt / (1/40))), h = dt/steps;
  for (let i=0;i<steps;i++){ T += h; [...pets].forEach(p => p.update(h, T)); }
  // separation + colliders + bounds (locked pets never get pushed)
  for (let i=0;i<pets.length;i++){
    const a = pets[i];
    for (let j=i+1;j<pets.length;j++){
      const b = pets[j], dx = b.x-a.x, dz = b.z-a.z, d = Math.hypot(dx,dz), m = (a.rad+b.rad)*.8;
      if (d < m && d > 1e-4){
        const wa = a.locked ? 0 : (b.locked ? 1 : .5), wb = b.locked ? 0 : (a.locked ? 1 : .5);
        const push = m-d, nx = dx/d, nz = dz/d; a.x -= nx*push*wa; a.z -= nz*push*wa; b.x += nx*push*wb; b.z += nz*push*wb;
      }
    }
    if (a.locked) continue;
    for (const c of env.colliders){ const dx = a.x-c.x, dz = a.z-c.z, d = Math.hypot(dx,dz), m = c.r + a.rad*.6; if (d < m && d > 1e-4){ a.x = c.x + dx/d*m; a.z = c.z + dz/d*m; } }
    if (a.actName !== 'path'){ const b = env.bounds, sl = D.guides || REC.active ? .25 : 1; a.x = clamp(a.x, b.minX-sl, b.maxX+sl); a.z = clamp(a.z, b.minZ-.6*sl, b.maxZ+sl); }
  }
  // treat
  if (treat){
    treat.t += dt;
    if (!treat.landed){ treat.vy -= 18*dt; treat.y += treat.vy*dt; if (treat.y < .08){ treat.y = .08; if (Math.abs(treat.vy) > 2){ treat.vy *= -.35; } else { treat.landed = true; treat.vy = 0; sfx('land'); } } }
    treat.m.position.set(treat.x, treat.y, treat.z); treat.m.rotation.y += dt*(treat.landed?1:6);
  }
  // particles
  for (let i=parts.length-1;i>=0;i--){ const q = parts[i]; q.life -= dt; q.v.y -= 9*dt; q.m.position.addScaledVector(q.v, dt); if (q.m.position.y < .03){ q.m.position.y = .03; q.v.multiplyScalar(.3); } q.m.scale.setScalar(q.s*clamp(q.life*3,0,1)); if (q.life <= 0){ scene.remove(q.m); parts.splice(i,1); } }
  for (let i=holes.length-1;i>=0;i--){ const h = holes[i]; h.t += dt; h.m.material.opacity = Math.min(.85, h.t*.5) * (1 - smooth(9,12,h.t)); h.m.scale.set(.32+Math.min(h.t,2)*.08, .24+Math.min(h.t,2)*.06, 1); if (h.t > 12){ scene.remove(h.m); h.m.material.dispose(); holes.splice(i,1); } }
  // director overlays (hidden while recording)
  ring.visible = !!selected && !D.rec;
  if (selected){ ring.position.set(selected.x, .02, selected.z); const s = (selected.rad*1.1)*(1+Math.sin(T*5)*.05); ring.scale.set(s,s,s); }
  pets.forEach(p => {
    p.lockRing.visible = p.locked && !D.rec && p !== selected;
    p.lockRing.position.set(p.x, .021, p.z); p.lockRing.scale.setScalar(p.rad*1.1);
    p.pathViz.visible = !D.rec && p.path.pts.length > 0 && (p === selected || D.tab === 'move');
  });
  updateView(rdt); controls.update();
  skyFollow.position.copy(camera.position);
  if (REC.active) updateRecSprites();
  renderer.render(scene, camera);
  updateFx(dt); updateBubbles(rdt); updateLabels();
  if (REC.active) REC.frames++; else adaptQuality(rdt);
  requestAnimationFrame(frame);
}
frame();
